# Keeps the Render free instance warm so the Telegram bot answers
# first thing in the morning. Runs on GitHub's servers — your laptop
# being off changes nothing. Manual runs: Actions tab → Run workflow.
name: Keep Render awake

on:
  schedule:
    # Every 10 minutes (Render free sleeps after ~15 min idle).
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 2 --max-time 120 https://qc-automation-hrci.onrender.com/health
