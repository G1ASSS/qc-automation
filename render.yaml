# One-click deploy for Render (https://render.com).
# NOTE (2026): Render's FREE web service sleeps after 15 min idle (~1 min cold
# start) and FREE Postgres expires 30 days after creation. For true free 24/7,
# prefer Oracle Cloud Always Free VM (see README) or a paid $7/mo Starter.
# This blueprint wires the app + managed Postgres with all required env vars.

services:
  - type: web
    name: qc-automation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qc-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_TAB
        value: QC Reports
      - key: ALLOWED_TELEGRAM_CHAT_IDS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: WECOM_CORP_ID
        sync: false
      - key: WECOM_AGENT_ID
        sync: false
      - key: WECOM_SECRET
        sync: false
      - key: WECOM_TOKEN
        sync: false
      - key: WECOM_AES_KEY
        sync: false
      - key: WECOM_ROBOT_KEY
        sync: false

databases:
  - name: qc-postgres
    plan: free
    databaseName: qc_reports
    user: qc_user
